<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1350" viewBox="0 0 2400 1350" font-family="Inter, Arial, sans-serif">
<title>Корсик: схема решения</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8a96a6"/></marker></defs>
<rect width="2400" height="1350" fill="#fbfcfe"/>
<rect x="10" y="10" width="2380" height="1330" rx="14" fill="none" stroke="#1f5fbf" stroke-width="1.6"/>
<rect x="24" y="26" width="2352" height="326" rx="14" fill="#fff" stroke="#e1e8f2"/>
<rect x="40" y="40" width="500" height="64" rx="10" fill="#dde9f8" stroke="none" stroke-width="1.4"/>
<text x="64" y="86" font-size="38" font-weight="bold" fill="#1f5fbf" text-anchor="start">1. Что делает система</text>
<text x="2356" y="80" font-size="17" font-weight="normal" fill="#8a96a6" text-anchor="end">Корсик · ПОЛИПЛАСТИК · «Открой#Моспром» 2026</text>
<rect x="36" y="120" width="537" height="218" rx="16" fill="#f2f6fc" stroke="#c7d6ec" stroke-width="1.4"/>
<circle cx="70" cy="158" r="19" fill="#1f5fbf"/>
<text x="70" y="165" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
<text x="100" y="166" font-size="24" font-weight="bold" fill="#1b2a3d" text-anchor="start">HR задаёт сценарий</text>
<text x="60" y="210" font-size="19" font-weight="normal" fill="#4f5a69" text-anchor="start">Загружает свой Excel или правит шаги</text>
<text x="60" y="239" font-size="19" font-weight="normal" fill="#4f5a69" text-anchor="start">в конструкторе: дни, кнопки, опросы,</text>
<text x="60" y="268" font-size="19" font-weight="normal" fill="#4f5a69" text-anchor="start">площадки.</text>
<rect x="633" y="120" width="537" height="218" rx="16" fill="#f2f6fc" stroke="#c7d6ec" stroke-width="1.4"/>
<circle cx="667" cy="158" r="19" fill="#1f5fbf"/>
<text x="667" y="165" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
<text x="697" y="166" font-size="24" font-weight="bold" fill="#1b2a3d" text-anchor="start">Бот сопровождает новичка в MAX</text>
<text x="657" y="210" font-size="19" font-weight="normal" fill="#4f5a69" text-anchor="start">Присылает шаги по дате выхода</text>
<text x="657" y="239" font-size="19" font-weight="normal" fill="#4f5a69" text-anchor="start">и площадке, в рабочее время.</text>
<text x="657" y="268" font-size="19" font-weight="normal" fill="#4f5a69" text-anchor="start">Пока новичок не ответил на вопрос,</text>
<text x="657" y="297" font-size="19" font-weight="normal" fill="#4f5a69" text-anchor="start">следующий шаг ждёт.</text>
<path d="M 581 229 L 625 229" fill="none" stroke="#8a96a6" stroke-width="2" marker-end="url(#ah)"/>
<rect x="1230" y="120" width="537" height="218" rx="16" fill="#f2f6fc" stroke="#c7d6ec" stroke-width="1.4"/>
<circle cx="1264" cy="158" r="19" fill="#1f5fbf"/>
<text x="1264" y="165" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
<text x="1294" y="166" font-size="24" font-weight="bold" fill="#1b2a3d" text-anchor="start">Бот отвечает на вопросы</text>
<text x="1254" y="210" font-size="19" font-weight="normal" fill="#4f5a69" text-anchor="start">Текстом или голосом, по регламентам.</text>
<text x="1254" y="239" font-size="19" font-weight="normal" fill="#4f5a69" text-anchor="start">К ответу прикладывает ссылку на пункт</text>
<text x="1254" y="268" font-size="19" font-weight="normal" fill="#4f5a69" text-anchor="start">ПВТР или слайд презентации.</text>
<path d="M 1178 229 L 1222 229" fill="none" stroke="#8a96a6" stroke-width="2" marker-end="url(#ah)"/>
<rect x="1827" y="120" width="537" height="218" rx="16" fill="#f2f6fc" stroke="#c7d6ec" stroke-width="1.4"/>
<circle cx="1861" cy="158" r="19" fill="#1f5fbf"/>
<text x="1861" y="165" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">4</text>
<text x="1891" y="166" font-size="24" font-weight="bold" fill="#1b2a3d" text-anchor="start">Бот передаёт проблему человеку</text>
<text x="1851" y="210" font-size="19" font-weight="normal" fill="#4f5a69" text-anchor="start">Тревожный ответ или жалоба становится</text>
<text x="1851" y="239" font-size="19" font-weight="normal" fill="#4f5a69" text-anchor="start">обращением к HR. Жалобы на руководителя</text>
<text x="1851" y="268" font-size="19" font-weight="normal" fill="#4f5a69" text-anchor="start">получают HR-партнёр и СБ, руководитель</text>
<text x="1851" y="297" font-size="19" font-weight="normal" fill="#4f5a69" text-anchor="start">их не видит.</text>
<path d="M 1775 229 L 1819 229" fill="none" stroke="#8a96a6" stroke-width="2" marker-end="url(#ah)"/>
<rect x="24" y="366" width="2352" height="486" rx="14" fill="#fff" stroke="#e1e8f2"/>
<rect x="40" y="380" width="760" height="64" rx="10" fill="#dde9f8" stroke="none" stroke-width="1.4"/>
<text x="64" y="426" font-size="38" font-weight="bold" fill="#1f5fbf" text-anchor="start">2. Как система ограничивает ошибки</text>
<rect x="36" y="460" width="1364" height="378" rx="16" fill="#f2f6fc" stroke="#c7d6ec" stroke-width="1.4"/>
<circle cx="70" cy="498" r="19" fill="#1f5fbf"/>
<text x="70" y="505" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">5</text>
<text x="100" y="506" font-size="24" font-weight="bold" fill="#1b2a3d" text-anchor="start">Модель может придумать ответ</text>
<text x="100" y="538" font-size="19" font-weight="normal" fill="#4f5a69" text-anchor="start">Ответ строится только из документа:</text>
<rect x="52" y="615" width="215" height="120" rx="12" fill="#fff" stroke="#c9d4e3" stroke-width="1.4"/>
<text x="159.5" y="655.65" font-size="19" font-weight="normal" fill="#4f5a69" text-anchor="middle">Поиск находит</text>
<text x="159.5" y="681.65" font-size="19" font-weight="normal" fill="#4f5a69" text-anchor="middle">подходящие пункты</text>
<text x="159.5" y="707.65" font-size="19" font-weight="normal" fill="#4f5a69" text-anchor="middle">регламентов</text>
<rect x="305" y="615" width="215" height="120" rx="12" fill="#fff" stroke="#c9d4e3" stroke-width="1.4"/>
<text x="412.5" y="655.65" font-size="19" font-weight="normal" fill="#4f5a69" text-anchor="middle">Модель получает</text>
<text x="412.5" y="681.65" font-size="19" font-weight="normal" fill="#4f5a69" text-anchor="middle">только эти пункты</text>
<text x="412.5" y="707.65" font-size="19" font-weight="normal" fill="#4f5a69" text-anchor="middle">и пишет ответ</text>
<path d="M 267 675 L 301 675" fill="none" stroke="#8a96a6" stroke-width="2" marker-end="url(#ah)"/>
<rect x="558" y="615" width="215" height="120" rx="12" fill="#fff" stroke="#c9d4e3" stroke-width="1.4"/>
<text x="665.5" y="655.65" font-size="19" font-weight="normal" fill="#4f5a69" text-anchor="middle">Код сверяет</text>
<text x="665.5" y="681.65" font-size="19" font-weight="normal" fill="#4f5a69" text-anchor="middle">цитату и числа</text>
<text x="665.5" y="707.65" font-size="19" font-weight="normal" fill="#4f5a69" text-anchor="middle">с текстом пункта</text>
<path d="M 520 675 L 554 675" fill="none" stroke="#8a96a6" stroke-width="2" marker-end="url(#ah)"/>
<path d="M 773 675 L 812.0 675" fill="none" stroke="#8a96a6" stroke-width="2" marker-end="url(#ah)"/>
<path d="M 815.0 675 L 930 587.0 L 1045.0 675 L 930 763.0 Z" fill="#fff" stroke="#1f5fbf" stroke-width="2"/>
<text x="930" y="657" font-size="19" font-weight="bold" fill="#1b2a3d" text-anchor="middle">Ответ</text>
<text x="930" y="681" font-size="19" font-weight="bold" fill="#1b2a3d" text-anchor="middle">подтверждён</text>
<text x="930" y="705" font-size="19" font-weight="bold" fill="#1b2a3d" text-anchor="middle">документом?</text>
<rect x="1122" y="560" width="262" height="90" rx="12" fill="#fff" stroke="#c9d4e3" stroke-width="1.4"/>
<text x="1253.0" y="598.65" font-size="19" font-weight="normal" fill="#4f5a69" text-anchor="middle">Ответ со ссылкой</text>
<text x="1253.0" y="624.65" font-size="19" font-weight="normal" fill="#4f5a69" text-anchor="middle">на пункт</text>
<path d="M 1045.0 675 L 1102 675 L 1102 605 L 1120 605" fill="none" stroke="#8a96a6" stroke-width="2" marker-end="url(#ah)"/>
<text x="1074" y="665" font-size="17" font-weight="bold" fill="#4f5a69" text-anchor="middle">да</text>
<rect x="1122" y="700" width="262" height="120" rx="12" fill="#fff" stroke="#1f5fbf" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="1253.0" y="741.3" font-size="18" font-weight="normal" fill="#4f5a69" text-anchor="middle">«Не нашёл</text>
<text x="1253.0" y="766.3" font-size="18" font-weight="normal" fill="#4f5a69" text-anchor="middle">в документах»</text>
<text x="1253.0" y="791.3" font-size="18" font-weight="normal" fill="#4f5a69" text-anchor="middle">и кнопка «Передать HR»</text>
<path d="M 930 763.0 L 930 790 L 1120 790" fill="none" stroke="#8a96a6" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#ah)"/>
<text x="940" y="782" font-size="17" font-weight="bold" fill="#4f5a69" text-anchor="start">нет</text>
<rect x="1430" y="460" width="452" height="181" rx="14" fill="#fff" stroke="#c9d4e3" stroke-width="1.4"/>
<circle cx="1462" cy="494" r="17" fill="#1f5fbf"/>
<text x="1462" y="501" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">6</text>
<text x="1490" y="501" font-size="21" font-weight="bold" fill="#1b2a3d" text-anchor="start">Вопрос на чувствительную тему</text>
<text x="1452" y="540" font-size="18" font-weight="normal" fill="#4f5a69" text-anchor="start">Вопросы об увольнении, конфликте</text>
<text x="1452" y="565" font-size="18" font-weight="normal" fill="#4f5a69" text-anchor="start">и здоровье бот сразу передаёт человеку,</text>
<text x="1452" y="590" font-size="18" font-weight="normal" fill="#4f5a69" text-anchor="start">модель на них не отвечает.</text>
<rect x="1912" y="460" width="452" height="181" rx="14" fill="#fff" stroke="#c9d4e3" stroke-width="1.4"/>
<circle cx="1944" cy="494" r="17" fill="#1f5fbf"/>
<text x="1944" y="501" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">7</text>
<text x="1972" y="501" font-size="21" font-weight="bold" fill="#1b2a3d" text-anchor="start">Ошибка в сценарии</text>
<text x="1934" y="540" font-size="18" font-weight="normal" fill="#4f5a69" text-anchor="start">Импорт помечает проблемы ТЗ</text>
<text x="1934" y="565" font-size="18" font-weight="normal" fill="#4f5a69" text-anchor="start">предупреждением со ссылкой на строку.</text>
<text x="1934" y="590" font-size="18" font-weight="normal" fill="#4f5a69" text-anchor="start">Перед публикацией HR видит, что изменится</text>
<text x="1934" y="615" font-size="18" font-weight="normal" fill="#4f5a69" text-anchor="start">и скольких новичков это затронет.</text>
<rect x="1430" y="657" width="452" height="181" rx="14" fill="#fff" stroke="#c9d4e3" stroke-width="1.4"/>
<circle cx="1462" cy="691" r="17" fill="#1f5fbf"/>
<text x="1462" y="698" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">8</text>
<text x="1490" y="698" font-size="21" font-weight="bold" fill="#1b2a3d" text-anchor="start">Сервер с моделью недоступен</text>
<text x="1452" y="737" font-size="18" font-weight="normal" fill="#4f5a69" text-anchor="start">Бот отвечает цитатой найденного пункта.</text>
<text x="1452" y="762" font-size="18" font-weight="normal" fill="#4f5a69" text-anchor="start">Сценарии, опросы и обращения</text>
<text x="1452" y="787" font-size="18" font-weight="normal" fill="#4f5a69" text-anchor="start">работают без модели.</text>
<rect x="1912" y="657" width="452" height="181" rx="14" fill="#fff" stroke="#c9d4e3" stroke-width="1.4"/>
<circle cx="1944" cy="691" r="17" fill="#1f5fbf"/>
<text x="1944" y="698" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">9</text>
<text x="1972" y="698" font-size="21" font-weight="bold" fill="#1b2a3d" text-anchor="start">Новичок не ответил</text>
<text x="1934" y="737" font-size="18" font-weight="normal" fill="#4f5a69" text-anchor="start">Когда подходит следующий блок,</text>
<text x="1934" y="762" font-size="18" font-weight="normal" fill="#4f5a69" text-anchor="start">обязательные шаги приходят одной</text>
<text x="1934" y="787" font-size="18" font-weight="normal" fill="#4f5a69" text-anchor="start">сводкой «Что вы пропустили»,</text>
<text x="1934" y="812" font-size="18" font-weight="normal" fill="#4f5a69" text-anchor="start">необязательные бот пропускает.</text>
<rect x="24" y="866" width="2352" height="438" rx="14" fill="#fff" stroke="#e1e8f2"/>
<rect x="40" y="880" width="470" height="64" rx="10" fill="#dde9f8" stroke="none" stroke-width="1.4"/>
<text x="64" y="926" font-size="38" font-weight="bold" fill="#1f5fbf" text-anchor="start">3. Чем подтверждено</text>
<rect x="36.0" y="960" width="446" height="328" rx="14" fill="#fff" stroke="#c9d4e3" stroke-width="1.4"/>
<text x="60.0" y="1052" font-size="76" font-weight="bold" fill="#1f5fbf" text-anchor="start">70</text>
<text x="60.0" y="1096" font-size="21" font-weight="bold" fill="#1b2a3d" text-anchor="start">строк Excel-ТЗ заказчика проверены</text>
<text x="60.0" y="1134" font-size="18" font-weight="normal" fill="#4f5a69" text-anchor="start">3 площадки, 18 тестовых новичков,</text>
<text x="60.0" y="1160" font-size="18" font-weight="normal" fill="#4f5a69" text-anchor="start">период с D−3 по D+92,</text>
<text x="60.0" y="1186" font-size="18" font-weight="normal" fill="#4f5a69" text-anchor="start">имитация MAX.</text>
<rect x="506.5" y="960" width="446" height="328" rx="14" fill="#fff" stroke="#c9d4e3" stroke-width="1.4"/>
<text x="530.5" y="1052" font-size="76" font-weight="bold" fill="#1f5fbf" text-anchor="start">0</text>
<text x="530.5" y="1096" font-size="21" font-weight="bold" fill="#1b2a3d" text-anchor="start">расхождений после выгрузки</text>
<text x="530.5" y="1134" font-size="18" font-weight="normal" fill="#4f5a69" text-anchor="start">Excel заказчика (57 шагов в 21 блоке)</text>
<text x="530.5" y="1160" font-size="18" font-weight="normal" fill="#4f5a69" text-anchor="start">загружен в конструктор, выгружен</text>
<text x="530.5" y="1186" font-size="18" font-weight="normal" fill="#4f5a69" text-anchor="start">обратно и сравнен с исходным.</text>
<rect x="977.0" y="960" width="446" height="328" rx="14" fill="#fff" stroke="#c9d4e3" stroke-width="1.4"/>
<text x="1001.0" y="1052" font-size="76" font-weight="bold" fill="#1f5fbf" text-anchor="start">85 %</text>
<text x="1001.0" y="1096" font-size="21" font-weight="bold" fill="#1b2a3d" text-anchor="start">разговорных вопросов: верный пункт</text>
<text x="1001.0" y="1134" font-size="18" font-weight="normal" fill="#4f5a69" text-anchor="start">60 вопросов по ПВТР и 3 презентациям,</text>
<text x="1001.0" y="1160" font-size="18" font-weight="normal" fill="#4f5a69" text-anchor="start">из них 26 разговорных.</text>
<text x="1001.0" y="1186" font-size="18" font-weight="normal" fill="#4f5a69" text-anchor="start">На 22 новых вопросах, которых не было</text>
<text x="1001.0" y="1212" font-size="18" font-weight="normal" fill="#4f5a69" text-anchor="start">при настройке: ≈60 % (13–14 из 22).</text>
<rect x="1447.5" y="960" width="446" height="328" rx="14" fill="#fff" stroke="#c9d4e3" stroke-width="1.4"/>
<text x="1471.5" y="1052" font-size="76" font-weight="bold" fill="#1f5fbf" text-anchor="start">25 из 25</text>
<text x="1471.5" y="1096" font-size="21" font-weight="bold" fill="#1b2a3d" text-anchor="start">отказов на вопросах вне документов</text>
<text x="1471.5" y="1134" font-size="18" font-weight="normal" fill="#4f5a69" text-anchor="start">20 вопросов, ответа на которые</text>
<text x="1471.5" y="1160" font-size="18" font-weight="normal" fill="#4f5a69" text-anchor="start">в документах нет, и 5 попыток взлома.</text>
<rect x="1918.0" y="960" width="446" height="328" rx="14" fill="#fff" stroke="#c9d4e3" stroke-width="1.4"/>
<text x="1942.0" y="1040" font-size="50" font-weight="bold" fill="#1f5fbf" text-anchor="start">Живой MAX</text>
<text x="1942.0" y="1096" font-size="21" font-weight="bold" fill="#1b2a3d" text-anchor="start">на телефоне</text>
<text x="1942.0" y="1134" font-size="18" font-weight="normal" fill="#4f5a69" text-anchor="start">Приглашение → ответ со ссылкой</text>
<text x="1942.0" y="1160" font-size="18" font-weight="normal" fill="#4f5a69" text-anchor="start">на пункт → передача HR →</text>
<text x="1942.0" y="1186" font-size="18" font-weight="normal" fill="#4f5a69" text-anchor="start">ответ HR в чате.</text>
<text x="1942.0" y="1262" font-size="17" font-weight="normal" fill="#8a96a6" text-anchor="start">Новички и данные тестовые.</text>
<text x="40" y="1328" font-size="16" font-weight="normal" fill="#8a96a6" text-anchor="start">Go · PostgreSQL · Vue · MAX Bot API · T-lite-it-2.1 (Qwen3) · bge-m3 · T-one · ВМ + GPU-серверы</text>
</svg>
