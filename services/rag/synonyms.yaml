# Словарь разговорной и кадровой лексики для расширения вопроса (query_expand.py).
#
# Если в вопросе встретился триггер, к запросу дописываются формулировки «языком регламента»
# из expand. Расширенный запрос идёт в BM25 и bge-m3, а с RAG_SYNONYMS=rerank — ещё и в
# реранкер (скор пункта = максимум по исходному и расширенному вопросу). Gate прежний.
#
# Триггер — слово или фраза в любой форме: сравнение идёт по леммам pymorphy3 подряд, без
# стоп-листа («за свой счёт» = «за своЙ счет»). Тексты документов сюда не копируем — только
# общеупотребительные кадровые термины.
#
# Осторожно с ловушками golden set: не расширять то, чего в регламентах нет (ДМС, проезд,
# пропуск, премия, парковка, ночная доплата, «можно опоздать»). Широкий триггер («обед»,
# «премия», «опоздать») поднимает скор ловушки — проверять `./run.sh eval --real --sweep`.

version: 1
groups:
  # режим работы и отдых
  - triggers: [пообедать, обедать, перекусить, покушать, поесть, перерыв на обед]
    expand: [перерыв для отдыха и питания, обеденный перерыв]
  - triggers: [перекур, покурить, курить, курилка, сигарета, вейп, электронная сигарета]
    expand: [курение, места для курения]
  - triggers: [кусками, кусок, по частям, частями, разбить отпуск, поделить отпуск, разделить отпуск]
    expand: [ежегодный оплачиваемый отпуск разделен на части]
  - triggers: [каникулы, отпускные]
    expand: [ежегодный оплачиваемый отпуск]
  - triggers: [отгул, за свой счёт, без оплаты]
    expand: [отпуск без сохранения заработной платы]
  - triggers: [жениться, выйти замуж, свадьба, расписаться]
    expand: [регистрация брака, отпуск без сохранения заработной платы]
  - triggers: [задержаться, переработка, перерабатывать, переработать, остаться после работы]
    expand: [сверхурочная работа]

  # неявка, болезнь
  - triggers: [проспать, не смогу выйти, не выйду на работу, не приду на работу]
    expand: [невыход на работу, неявка на работу, известить руководителя]
  - triggers: [больничный, больничный лист]
    expand: [временная нетрудоспособность, листок нетрудоспособности]
  - triggers: [прогулять]
    expand: [прогул]

  # приём на работу
  - triggers: [испыталка, испытательный период]
    expand: [срок испытания при приеме на работу]
  - triggers: [оформление, оформляться, устраиваться, устройство на работу, бумаги]
    expand: [документы при приеме на работу, заключение трудового договора]

  # деньги
  - triggers: [зп, получка, зарплата, деньги за работу, зарплату]
    expand: [заработная плата, выплата заработной платы]

  # внешний вид, поведение
  - triggers: [дресс код, дресскод, как выглядеть, как одеваться, в чем ходить]
    expand: [внешний вид, деловой стиль, выглядеть опрятно и аккуратно]
  - triggers: [сфоткать, фоткать, фотографировать, фотка, снимать на телефон, соцсети, соцсеть]
    expand: [фото- и видеосъемка, распространение информации]

  # дисциплина
  - triggers: [выговор]
    expand: [дисциплинарное взыскание, снятие дисциплинарного взыскания]

  # антикоррупция и коммерческая тайна
  - triggers: [откат, взятка, подкуп, конверт]
    expand: [коррупция, незаконное вознаграждение, сообщить о коррупционном правонарушении]
  - triggers: [коньяк, презент, подарить, дарить]
    expand: [деловой подарок, стоимость подарков]
  - triggers: [разболтать, проболтаться, слить, рассказать знакомому, рассказать другу, рассказать друзьям]
    expand: [разглашение коммерческой тайны, конфиденциальная информация]
