# Таксономия красных флагов «Корсика» F0–F10.
# Источник правды для маршрутов, порогов и видимости. Промпт разметки:
# agency/prompts/flags-classify.md (определения там должны совпадать с name/markers ниже).
#
# Источники: ресерч 2026-10-23, блок C (F1–F10, маршруты, пороги, правила);
# UX-спека v1, п. 0 (правило 6), 1 (роли), 2.3, 2.7, 3.7; steps/02-open-questions.md
# (противоречия 4, 7, 12; вопросы 5, 14).
#
# Статус: черновик. Там, где источники расходятся, оба варианта записаны в `conflict`,
# стартовый выбран в `conflict.chosen`. Каждый выбор ждёт подтверждения человека
# (`conflict.status: pending_human`). Пороги — экспертные предложения ресерча, на реальных
# данных не калибровались.

version: 1
updated: 2026-10-23
status: draft

# Роли-получатели. Имена совпадают с ролями UX-спеки, п. 1.
recipients:
  hr: "HR-менеджер (куратор от HR)"
  hr_bp: "HR-партнёр. В UX-ролях отдельной роли нет; на старте это тот же HR-менеджер с правами на конфиденциальные обращения"
  recruiter: "Рекрутер"
  manager: "Руководитель подразделения новичка"
  skip_manager: "Руководитель руководителя"
  security: "СБ / комплаенс (отдельный групповой чат в MAX)"
  duty: "Дежурный площадки (охрана труда / смена) — контакт берётся из настроек площадки"

# Что видит руководитель подразделения по флагу своего новичка.
manager_visibility_levels:
  category: "видит категорию и нужное действие («нет доступа — проверьте заявку»), без текста ответов"
  signal_only: "видит только общий сигнал «встретьтесь 1:1» без категории и без текста"
  none: "не видит ничего, флаг не влияет на сообщения руководителю"
# Общее правило UX 3.7: тексты ответов руководителю не показываются никогда, при любом уровне.

severity:
  1: "упоминание, работе не мешает"
  2: "мешает работать или повторяется"
  3: "угроза уходу, безопасности, здоровью или жизни"

rules:
  # Ресерч, блок C. Код применяет их к выходу /flags; LLM эскалацию не решает (UX правило 6).
  escalate_if:
    severity_gte: 2
    any_of_codes: [F0, F5, F7, F9]
  thresholds:
    # Двойной порог: confidence ≥ auto_escalation → авто-уведомление по маршруту;
    # manual_review_floor ≤ confidence < auto_escalation → очередь ручного ревью HR;
    # ниже manual_review_floor → только агрегаты (дайджест, heat map).
    manual_review_floor: 0.4
  repeat_bump: "тот же флаг в двух пульсах подряд → severity +1 (не выше 3)"
  critical_skip_digest: "критические коды не ждут дайджеста, уведомление сразу"
  never_to_manager: [F4, F5, F9]   # UX 3.7: «без категорий F4/F5/F9»
  anonymity_min_group: 5           # UX 3.7: heat map и цитаты в агрегатах — группы ≥ 5
  no_flag: "пустой список flags. Код F0 НЕ означает «нет флага» (см. F0.conflict)"
  # Regex-триггеры живут в Go (api_contract.md) и срабатывают независимо от LLM.
  # Здесь только для сверки соответствия кодам, менять в Go.
  go_regex_triggers_reference:
    "уволь*": F7
    "увольня*": F7
    "взятк*": F9
    "откат*": F9
    "ударил*": F5

categories:

  F0:
    name: "Угроза жизни и здоровью"
    description: "Опасность прямо сейчас: травма, пожар, газ, задымление, угроза насилием, мысли о самоубийстве"
    markers: ["травмировался", "придавило", "пахнет газом", "задымление", "пожар", "угрожает избить", "не хочу жить"]
    not_markers: ["этот отчёт меня убьёт", "сдохну от жары", "умираю от скуки"]   # идиомы
    route: [duty, hr]
    route_note: "новичку сразу — телефон экстренной службы и дежурного, без обещаний «мы приедем» (UX 2.7)"
    urgency: "немедленно"
    sla: "сразу, в любое время (тихие часы не действуют)"
    auto_escalation_threshold: 0.5
    manual_review: true
    critical: true
    manager_visibility: none
    store_quote: true    # кроме текстов о собственном здоровье — правило пустой цитаты в промпте и коде
    conflict:
      topic: "смысл кода F0"
      ux_spec: "F0 — угроза жизни: телефон экстренной службы и дежурного (UX 2.7)"
      research: "таксономия F1–F10; в Pydantic-схеме flags: list[F0..F10], смысл F0 не определён (похоже на «нет флага»)"
      chosen: ux_spec
      rationale: "Опасность для жизни — единственная категория, где ответ нужен в минутах, и её нет в F1–F10. «Нет флага» однозначно выражается пустым списком, отдельный код для этого не нужен. Так записано и в 02-open-questions, противоречие 7"
      status: pending_human
    assumptions:
      - "Маршрут duty + hr, порог 0.5, manager_visibility=none — наши допущения; ни в одном источнике их нет. Видимость none, потому что F0 включает мысли о самоубийстве (сведения о здоровье). Для происшествий на линии оперативно действует дежурный, а не руководитель через бота"
      - "Экстренный телефон и дежурный — из настроек площадки; номеров в данных нет"

  F1:
    name: "Непонимание задач и ожиданий"
    description: "Непонятно, что делать; работа не та, что обещали; нет плана"
    markers: ["не то, что обещали", "нет плана", "не понимаю, что от меня хотят", "задачи не ставят"]
    anchor: "67 % (hh.ru 2025); 58 % — разрыв обещаний и реальности (Edstein)"
    route: [manager, hr]
    urgency: "обычная"
    sla: "≤ 5 рабочих дней"
    auto_escalation_threshold: 0.6
    manual_review: false
    critical: false
    manager_visibility: category
    store_quote: true

  F2:
    name: "Нет доступов, техники, СИЗ, пропуска"
    description: "Нет учётки, доступа к системам, рабочего места, техники, спецодежды, пропуска"
    markers: ["нет доступа к 1С", "пропуск не работает", "нет компьютера", "спецовки нет по размеру", "СЭД не открывается"]
    anchor: "вопрос дня 7 (Survio); D0 12:00 «Проверка доступов» (UX 2.3)"
    route: [hr, manager]
    route_note: "руководителю — уведомление; новичку — «Передал. Пока уточните у руководителя, когда будет готово»"
    urgency: "высокая"
    sla: "≤ 2 рабочих дня"
    auto_escalation_threshold: 0.5
    manual_review: false
    critical: false
    manager_visibility: category
    store_quote: true
    conflict:
      topic: "маршрут F2"
      ux_spec: "обращение HR + уведомление руководителю (UX 2.3, D0 12:00; кабинет «F2 → HR (P1) + уведомить руководителя»)"
      research: "HR-ops / ИТ / АХО"
      chosen: ux_spec
      rationale: "Каналов ИТ и АХО у нас нет: в UX-ролях их нет, отдельных чатов нет. HR — единственный получатель, который точно существует и отвечает в SLA, а руководитель может выдать доступ или технику сам. Когда ответят на вопрос 5 (куда передавать), маршрут расширяется до ИТ/АХО по подкатегории: «Техника» и «Учётка» → ИТ, «Пропуск» → АХО (кнопки-причины UX 2.3)"
      status: pending_human
      question_ref: "02-open-questions.md, вопрос 5; противоречие 12"

  F3:
    name: "Нет поддержки руководителя"
    description: "Руководителя не видно, не к кому обратиться, руководитель не отвечает"
    markers: ["руководителя не видел", "не к кому обратиться", "руководитель не отвечает"]
    anchor: "33 % — руководитель (hh.ru 2025)"
    route: [hr_bp, skip_manager]
    urgency: "средняя-высокая"
    sla: "≤ 3 рабочих дня (допущение: в ресерче срок не указан)"
    auto_escalation_threshold: 0.6
    manual_review: false
    critical: false
    manager_visibility: signal_only
    store_quote: true
    conflict:
      topic: "видимость F3 руководителю"
      ux_spec: "UX 3.7 скрывает от руководителя только F4/F5/F9, то есть по букве F3 видна; но правило 6: «Конфликт с руководителем никогда не уходит этому руководителю»"
      research: "маршрут HR BP → руководитель руководителя, то есть мимо прямого руководителя"
      chosen: "signal_only"
      rationale: "Жалоба на руководителя с категорией «нет поддержки руководителя» прямо указывает на автора и на самого адресата. signal_only («встретьтесь 1:1» без категории) — компромисс: руководитель получает повод к действию, но не видит, что жаловались на него. Это соответствует правилу 6 и маршруту ресерча"
      status: pending_human

  F4:
    name: "Конфликт с наставником или коллегами"
    description: "Наставник не помогает, коллеги не принимают, холод в команде"
    markers: ["наставник не объясняет", "команда не принимает", "со мной не разговаривают"]
    anchor: "21 % — коллектив (hh.ru 2025)"
    route: [hr_bp]
    route_note: "не руководителю (ресерч); UX 2.7: кнопка «без моего имени» только если HR обеспечивает анонимность (вопрос 16)"
    urgency: "высокая"
    sla: "≤ 2 рабочих дня (допущение: в ресерче только «высокая»)"
    auto_escalation_threshold: 0.6
    manual_review: false
    critical: false
    manager_visibility: none
    store_quote: true

  F5:
    name: "Грубость, унижение, харассмент"
    description: "Крик, оскорбления, унижение, домогательства"
    markers: ["орёт", "унижает", "оскорбляет", "пошлые шутки в мой адрес"]
    anchor: "Environment 7 %"
    route: [hr_bp, security]
    route_note: "security — только при угрозах (ресерч); новичку: «Передаю HR-партнёру. Эту переписку видит только он(а)» (UX 2.7)"
    urgency: "критическая"
    sla: "≤ 1 рабочий день"
    auto_escalation_threshold: 0.5
    manual_review: true
    critical: true
    manager_visibility: none
    store_quote: true

  F6:
    name: "Перегрузка, выгорание"
    description: "Не справляется с объёмом, переработки, нет выходных"
    markers: ["не справляюсь", "сижу до ночи", "смены по 12 часов", "не вывожу"]
    anchor: "50 % — не справляюсь с нагрузкой (hh.ru 2025)"
    route: [manager, hr]
    urgency: "средняя"
    sla: "≤ 5 рабочих дней (допущение)"
    auto_escalation_threshold: 0.6
    manual_review: false
    critical: false
    manager_visibility: category
    store_quote: true

  F7:
    name: "Намерение уйти"
    description: "Думает об уходе, ищет работу, есть оффер, не уверен, что останется"
    markers: ["уволюсь", "ищу работу", "обновил резюме", "есть оффер", "не уверен, что останусь"]
    anchor: "40 % думали об уходе (Edstein); 41 % — оффер конкурента (hh.ru 2025)"
    route: [recruiter, hr_bp]
    route_note: "руководителю — только задача «встреча 1:1» без текста и категории; D+90 «Не уверен / Нет» на «планируешь остаться» → F7 (UX 2.3)"
    urgency: "критическая"
    sla: "≤ 1–2 рабочих дня"
    auto_escalation_threshold: 0.5
    manual_review: false
    critical: true
    manager_visibility: signal_only
    store_quote: true
    conflict:
      topic: "маршрут F7"
      ux_spec: "рекрутер (UX 2.3 D+90; роли: рекрутер получает «намерение уйти»)"
      research: "HR BP + руководитель"
      chosen: "recruiter + hr_bp; руководителю signal_only (задача 1:1 без текста)"
      rationale: "Рекрутер ведёт встречу D+45 и знает, что обещали при найме: самая частая причина ухода — разрыв обещаний (58 %). HR BP нужен как владелец удержания. Прямую передачу руководителю не берём: часть F7 вызвана руководителем (33 % по hh.ru), и правило 6 запрещает такие тексты ему отдавать. Сигнал 1:1 сохраняет полезную часть варианта ресерча. Совпадает с допущением 02-open-questions, вопрос 14"
      status: pending_human
      question_ref: "02-open-questions.md, вопрос 14; противоречие 4"

  F8:
    name: "Оплата или график не совпали с обещанным"
    description: "Зарплата, график, смены, условия не такие, как говорили при найме"
    markers: ["обещали другую зарплату", "говорили 5/2, а ставят в выходные", "про ночные смены не говорили"]
    anchor: "зарплата 33 %, график 22 % (hh.ru 2025)"
    route: [hr, recruiter]
    route_note: "hr — компенсации; recruiter — обратная связь по обещаниям (раздел 5 дайджеста)"
    urgency: "средняя"
    sla: "≤ 5 рабочих дней (допущение)"
    auto_escalation_threshold: 0.6
    manual_review: false
    critical: false
    manager_visibility: category
    store_quote: true

  F9:
    name: "Этика, коррупция, нарушения ТБ, служебная тайна"
    description: "Подписи задним числом, откаты, взятки, нарушения техники безопасности без немедленной опасности"
    markers: ["расписаться задним числом", "откаты", "взятка", "работаем без касок, мастер велел"]
    anchor: "специфика производства (ресерч)"
    route: [security]
    route_note: "СБ/комплаенс напрямую, минуя руководителя и HR-менеджера (UX 1, 2.7); конфиденциально"
    urgency: "критическая"
    sla: "≤ 1 рабочий день"
    auto_escalation_threshold: 0.4
    manual_review: true
    critical: true
    manager_visibility: none
    store_quote: true

  F10:
    name: "Личные обстоятельства и здоровье"
    description: "Болезнь, больничный, семья, переезд"
    markers: ["болею", "на больничном", "ребёнок заболел", "переезжаю"]
    anchor: "Health & Family 12.4 %"
    route: [hr]
    route_note: "мягко; детали не хранить (ресерч, 152-ФЗ: минимизация)"
    urgency: "низкая"
    sla: "≤ 5 рабочих дней (допущение)"
    auto_escalation_threshold: 0.6
    manual_review: false
    critical: false
    manager_visibility: none
    store_quote: false   # хранить только категорию, цитату не выводить и не сохранять
    assumptions:
      - "manager_visibility=none — наше решение (в источниках не указано): сведения о здоровье и семье руководителю через бота не передаём"
